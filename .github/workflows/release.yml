name: Release

# Push-button release: builds the app + embedded backend on a macOS runner,
# ad-hoc code-signs it, EdDSA-signs the zip with the SIGNING_PRIVATE_KEY secret,
# publishes a GitHub Release, and bumps callbridge-update.json so installed
# copies auto-update within the hour.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Cockpit line: 3.0.0 from cockpit (stable) or 3.0.0-beta.1 from cockpit-beta"
        required: true

permissions:
  contents: write

# Never run two releases at once (they would race on the version-bump commits).
concurrency: release

jobs:
  release:
    # Cockpit line: stable releases only from cockpit, beta releases only from cockpit-beta.
    # The classic line releases from main and beta with its own copy of this workflow.
    if: >-
      (github.ref == 'refs/heads/cockpit' && !contains(inputs.version, '-beta.')) ||
      (github.ref == 'refs/heads/cockpit-beta' && contains(inputs.version, '-beta.'))
    runs-on: macos-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION' (expected 3.0.0 or 3.0.0-beta.1)"
            exit 1
          fi
          # The cockpit line is 3.x; 2.x tags belong to the classic line on main.
          if [[ "$VERSION" != 3.* ]]; then
            echo "::error::Cockpit releases are 3.x; 2.x is the classic line (main/beta)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Restore EdDSA signing key
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
        run: printf 'SIGNING_PRIVATE_KEY=%s\n' "$SIGNING_PRIVATE_KEY" > .env

      - name: Build, code-sign, and sign the update
        run: |
          chmod +x build-release.sh
          ./build-release.sh "$VERSION"

      # Ordering matters: installed copies follow callbridge-update.json on this branch.
      # We push the version bump first, create the release pointing at that
      # commit, and only then push the manifest. If the release step fails,
      # the manifest on this branch still points at the previous (existing) release.
      - name: Commit + push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CallBridge/CallBridge/main.swift CallBridge/CallBridge/Info.plist
          git commit -m "Bump version to v$VERSION"
          git push
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [[ "$VERSION" == *-beta.* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "v$VERSION" CallBridge.app.zip "audio-hijack/Voice Chat.ah4session" \
            --target "$RELEASE_SHA" $PRERELEASE \
            --title "CallBridge v$VERSION" \
            --notes "Automated build. Install manually via gh release download; auto-update is disabled on this private repo. Includes the Audio Hijack Voice Chat session template (import it into Audio Hijack on each Mac)."

      - name: Commit + push update manifest
        run: |
          git add callbridge-update.json
          git commit -m "Release v$VERSION"
          git push

      - name: Remove signing key from runner
        if: always()
        run: rm -f .env
