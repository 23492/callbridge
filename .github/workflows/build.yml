name: Build

# Compile check on every push to beta and on pull requests: the app only builds
# on macOS (Cocoa/SwiftUI), so this is the only place the full source is type-checked.
on:
  push:
    branches: [beta]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Source marker guard
        run: ./scripts/check-source-markers.sh

      - name: Core tests
        run: ./scripts/test-core.sh

      - name: Core runner fails on a failing test
        run: '! ./scripts/test-core.sh tests/fixtures/AlwaysFailsTests.swift'

      - name: Update-channel logic tests
        run: ./scripts/test-update-channel.sh

      - name: Backend tests
        run: python3 -m venv .venv && .venv/bin/pip install -r requirements.txt && .venv/bin/python -m unittest discover -s tests/python -t . -v

      - name: Build app
        working-directory: CallBridge
        run: swift build -c release
